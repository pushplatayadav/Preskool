{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0">
	<meta name="description" content="Preskool - Bootstrap Admin Template">
	<meta name="keywords" content="admin, estimates, bootstrap, business, html5, responsive, Projects">
	<meta name="author" content="Dreams technologies - Bootstrap Admin Template">
	<meta name="robots" content="noindex, nofollow">
	<title>Preskool Admin Template</title>

	<!-- Favicon -->
	<link rel="shortcut icon" type="image/x-icon" href="{% static 'assets/img/favicon.png' %}">

	<!-- Theme Script js -->
	<script src="{% static 'assets/js/theme-script.js' %}"></script>

	<!-- Bootstrap CSS -->
	<link rel="stylesheet" href="{% static 'assets/css/bootstrap.min.css' %}">

	<!-- Feather CSS -->
	<link rel="stylesheet" href="{% static 'assets/plugins/icons/feather/feather.css' %}">

	<!-- Tabler Icon CSS -->
	<link rel="stylesheet" href="{% static 'assets/plugins/tabler-icons/tabler-icons.css' %}">

	<!-- Daterangepikcer CSS -->
	<link rel="stylesheet" href="{% static 'assets/plugins/daterangepicker/daterangepicker.css' %}">

	<!-- Select2 CSS -->
	<link rel="stylesheet" href="{% static 'assets/plugins/select2/css/select2.min.css' %}">

	<!-- Fontawesome CSS -->
	<link rel="stylesheet" href="{% static 'assets/plugins/fontawesome/css/fontawesome.min.css' %}">
	<link rel="stylesheet" href="{% static 'assets/plugins/fontawesome/css/all.min.css' %}">

	<!-- Datetimepicker CSS -->
	<link rel="stylesheet" href="{% static 'assets/css/bootstrap-datetimepicker.min.css' %}">

	<!-- Bootstrap Tagsinput CSS -->
	<link rel="stylesheet" href="{% static 'assets/plugins/bootstrap-tagsinput/bootstrap-tagsinput.css' %}">

	<!-- Owl Carousel CSS -->
	<link rel="stylesheet" href="{% static 'assets/plugins/owlcarousel/owl.carousel.min.css' %}">
	<link rel="stylesheet" href="{% static 'assets/plugins/owlcarousel/owl.theme.default.min.css' %}">

	<!-- Main CSS -->
	<link rel="stylesheet" href="{% static 'assets/css/style.css' %}">

	{% block extra_css %}{% endblock %}
</head>

<body>

	<div id="global-loader">
		<div class="page-loader"></div>
	</div>

	<!-- Main Wrapper -->
	<div class="main-wrapper">

		<!-- Header -->
		{% include 'portaluser/includes/header.html' %}
		<!-- /Header -->

		<!-- Sidebar -->
		{% include 'portaluser/includes/sidebar.html' %}
		<!-- /Sidebar -->

		{% block content %}
		{% endblock %}

	</div>
	<!-- /Main Wrapper -->

	{% block modals %}{% endblock %}

	<!-- jQuery -->
	<script src="{% static 'assets/js/jquery-3.7.1.min.js' %}"></script>

	<!-- Bootstrap Core JS -->
	<script src="{% static 'assets/js/bootstrap.bundle.min.js' %}"></script>

	<!-- Daterangepikcer JS -->
	<script src="{% static 'assets/js/moment.js' %}"></script>
	<script src="{% static 'assets/plugins/daterangepicker/daterangepicker.js' %}"></script>
	<script src="{% static 'assets/js/bootstrap-datetimepicker.min.js' %}"></script>

	<!-- Feather Icon JS -->
	<script src="{% static 'assets/js/feather.min.js' %}"></script>

	<!-- Slimscroll JS -->
	<script src="{% static 'assets/js/jquery.slimscroll.min.js' %}"></script>

	<!-- Chart JS -->
	<script src="{% static 'assets/plugins/apexchart/apexcharts.min.js' %}"></script>
	<script src="{% static 'assets/plugins/apexchart/chart-data.js' %}"></script>

	<!-- Owl JS -->
	<script src="{% static 'assets/plugins/owlcarousel/owl.carousel.min.js' %}"></script>

	<!-- Select2 JS -->
	<script src="{% static 'assets/plugins/select2/js/select2.min.js' %}"></script>

	<!-- Counter JS -->
	<script src="{% static 'assets/plugins/countup/jquery.counterup.min.js' %}"></script>
	<script src="{% static 'assets/plugins/countup/jquery.waypoints.min.js' %}"></script>

	<!-- Bootstrap Tagsinput JS -->
	<script src="{% static 'assets/plugins/bootstrap-tagsinput/bootstrap-tagsinput.js' %}"></script>

	{% block extra_js %}{% endblock %}

	<!-- Custom JS -->
	<script src="{% static 'assets/js/script.js' %}"></script>
</body>

</html>
